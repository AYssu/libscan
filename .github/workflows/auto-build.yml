name: NDK-Build Release

on:
  push:
    tags:
      - "v*"  # Push events to matching v*, i.e. v1.0, v20.15.10

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout source
      uses: actions/checkout@v2

    - name: Setup Android NDK
      uses: actions/setup-java@v2
      with:
        java-version: '11'
        distribution: 'adopt'

    - name: Download and extract NDK
      run: |
        mkdir -p ~/android-ndk
        wget https://dl.google.com/android/repository/android-ndk-r28c-linux.zip -O ~/android-ndk/android-ndk.zip
        unzip ~/android-ndk/android-ndk.zip -d ~/android-ndk
        export ANDROID_NDK_HOME=~/android-ndk/android-ndk-r25c
        echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME" >> $GITHUB_ENV

    - name: Build with ndk-build
      run: |
        export ANDROID_NDK_HOME=$ANDROID_NDK_HOME
        ndk-build -C .

    - name: Zip the Build
      run: |
        mkdir -p ./build
        zip -r ./build/libs_arm64-v8a.zip ./libs/arm64-v8a/

    - name: Create Release and Upload Release Asset
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        tag_name: ${{ github.ref }}
        name: Release ${{ github.ref }}
        body: TODO New Release.
        draft: false
        prerelease: false
        files: |
          ./build/libs_arm64-v8a.zip
          LICENSE
