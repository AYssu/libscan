name: Build libsyscall.so

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build with Android NDK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android NDK
      run: |
        wget -q https://dl.google.com/android/repository/android-ndk-r28c-linux.zip -O /tmp/ndk.zip
        unzip -q /tmp/ndk.zip -d /opt
        echo "ANDROID_NDK_HOME=/opt/android-ndk-r28c" >> $GITHUB_ENV

    - name: Build
      run: |
        $ANDROID_NDK_HOME/ndk-build -C . \
          NDK_PROJECT_PATH=. \
          APP_BUILD_SCRIPT=./jni/Android.mk
        ls -lh libs/arm64-v8a/

    - name: Package
      run: |
        mkdir -p release
        cd libs/arm64-v8a
        zip ../../release/libsyscall-arm64-v8a.zip libsyscall.so

    - name: Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: ./release/libsyscall-arm64-v8a.zip
